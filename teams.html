<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One Date Club — Team Auction Summary</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="nav">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        One Date Club — 隊伍拍賣摘要
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn" href="index.html">🏠 返回遊戲</a>
      <a class="btn" href="items.html">🧾 拍賣目錄</a>
      <a class="btn" href="rules.html">📜 遊戲規則</a>
      <a class="btn" href="rank.html">🎯 排名</a>
      <a class="btn primary" href="teams.html">👥 隊伍列表</a>
    </div>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="card-h">
        <h2>隊伍拍賣摘要</h2>
        <span class="pill">出價歷史</span>
      </div>
      <div class="card-b teamTableWrapper" id="teamList"></div>
    </section>
  </main>
  
  <script src="constant.js"></script>
  <script>
    (function() {
      function loadGameState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function saveGameState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function getItemById(id) {
        return items.find(x => x.id === id) || { icon: "❔", desc: `物品 ${id}` };
      }

      function isGameStarted(fullState) {
        if (!fullState?.rounds) return false;
        return fullState.rounds.some(r => r.started);
      }

      function isGameComplete(fullState) {
        if (!fullState?.rounds) return false;
        return fullState.rounds.every(r => r.done);
      }

      
      

      function renderTeams(fullState) {
        const elTeamList = document.getElementById("teamList");
        elTeamList.innerHTML = "";

        const rankMaps = fullState.teams.reduce((acc, team) => {
          const teamBids = fullState.rounds.map(round => round.bids?.[team.id]).filter(b => Number.isFinite(b));
          const uniqueSortedBids = [...new Set(teamBids)].sort((a, b) => b - a);
          acc[team.id] = uniqueSortedBids.reduce((map, bid, index) => {
            map[bid] = index + 1;
            return map;
          }, {});
          return acc;
        }, {});

        const table = document.createElement("table");
        table.className = "teamsTable";

        const headerHtml = `
          <thead>
            <tr>
              <th class="teamsTableRoundHeader">拍賣品</th>
              ${fullState.teams.map(team => `<th><div class="dot" style="background:${team.color}; display: inline-block;"></div> ${team.name}</th>`).join("")}
            </tr>
          </thead>
        `;

        const bodyHtml = fullState.rounds.map(round => {
          const item = getItemById(round.id);

          return `
            <tr class="teamsTableRound">
              <th class="teamsTableRowHeader">
                <div class="roundHeaderContent">
                  <span class="teamRoundIcon">${item.icon}</span>
                  <div class="roundHeaderText">
                    <div class="teamRoundName">${item.desc}</div>
                  </div>
                </div>
              </th>
              ${fullState.teams.map(team => {
                const bid = round.bids?.[team.id];
                const won = round.winnerTeamId !== null && round.winnerTeamId === team.id;
                const finalRank = Number.isFinite(bid) ? rankMaps[team.id]?.[bid] : null;
                const originalRank = team.itemPriorities?.[round.id] || "-";
                const finalRankHtml = finalRank ? `<span class="cellRank">#${finalRank}</span>` : "";
                const priceText = Number.isFinite(bid) ? `${originalRank} | ${finalRankHtml}${bid}` : "未出價";

                return `
                  <td class="${won ? "winCell" : ""}">
                    <div class="cellPrice">${priceText}</div>
                  </td>
                `;
              }).join("")}
            </tr>
          `;
        }).join("");

        table.innerHTML = headerHtml + `<tbody>${bodyHtml}</tbody>`;
        elTeamList.appendChild(table);
      }

      function init() {
        const fullState = loadGameState();
        if (!fullState) return;

        renderTeams(fullState);
      }

      init();
      // Auto-refresh every 2 seconds to pick up changes from index.html
      setInterval(init, 2000);
    })();
  </script>
  <!--<footer class="footer">
    © 2026 Flow Church Actionable One Date Club — All Rights Reserved
  </footer>-->
</body>
</html>
